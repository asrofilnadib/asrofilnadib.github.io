<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 2080" width="100%" role="img" aria-label="TMS Transportation Management process flowchart">
  <defs>
    <marker id="tms-fc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
  </defs>
  <style>
    .box { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .decision { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .label { fill: #e8e8e8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 15px; text-anchor: middle; }
    .sub { font-size: 13px; }
    .fa { font-family: "Font Awesome 6 Pro", "Font Awesome 6 Free", sans-serif; font-weight: 900; font-size: 9px; fill: #8750f7; }
    .edge { stroke: #c9c9c9; stroke-width: 1.5; fill: none; marker-end: url(#tms-fc-arrow); }
    .edge-label { fill: #b0b0b0; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 12px; text-anchor: middle; }
  </style>

  <rect class="box" x="180" y="16" width="380" height="52" rx="8"/>
  <text class="label" x="370" y="38">Produksi upload Excel SAP</text>
  <text class="label sub" x="370" y="56">tms_material_reservasi (RSV-...)</text>
  <path class="edge" d="M370 68 V96"/>

  <rect class="box" x="150" y="96" width="440" height="56" rx="8"/>
  <text class="label" x="370" y="120">Admin WSM upload picking list</text>
  <text class="label sub" x="370" y="138">per no_reservasi + MID / konversi palet</text>
  <path class="edge" d="M370 152 V180"/>

  <rect class="box" x="180" y="180" width="380" height="52" rx="8"/>
  <text class="label" x="370" y="202">Staging checklist dokumen</text>
  <text class="label sub" x="370" y="220">material status = aktif</text>
  <path class="edge" d="M370 232 V260"/>

  <rect class="box" x="140" y="260" width="460" height="56" rx="8"/>
  <text class="label" x="370" y="284">Pengawas buat draft (max 12 palet)</text>
  <text class="label sub" x="370" y="302">SJ-... <tspan class="fa">&#xf054;</tspan> multi tujuan to / to_2 / to_3</text>
  <path class="edge" d="M370 316 V344"/>

  <rect class="box" x="160" y="344" width="420" height="48" rx="8"/>
  <text class="label" x="370" y="373">Store-request + WebSocket / Telegram</text>
  <path class="edge" d="M370 392 V420"/>

  <polygon class="decision" points="370,420 480,486 370,552 260,486"/>
  <text class="label" x="370" y="478">Driver aktif?</text>
  <text class="label sub" x="370" y="498">QR gedung</text>
  <text class="edge-label" x="198" y="486">Tidak</text>
  <text class="edge-label" x="542" y="486">Ya</text>

  <path class="edge" d="M260 486 H130 V560"/>
  <rect class="box" x="20" y="560" width="200" height="48" rx="8"/>
  <text class="label sub" x="120" y="588">blokir accept</text>

  <path class="edge" d="M480 486 H610 V572 H370 V600"/>

  <polygon class="decision" points="370,600 480,666 370,732 260,666"/>
  <text class="label" x="370" y="670">Terima order?</text>
  <text class="edge-label" x="192" y="666">Reject</text>
  <text class="edge-label" x="548" y="666">Accept</text>

  <path class="edge" d="M260 666 H100 V368 H160"/>
  <text class="edge-label" x="70" y="510">tetap request</text>

  <path class="edge" d="M480 666 H610 V756 H370 V776"/>

  <rect class="box" x="160" y="776" width="420" height="52" rx="8"/>
  <text class="label" x="370" y="798">on_proses + SJ jadi DO</text>
  <text class="label sub" x="370" y="816">race-accept: siapa cepat dia dapat</text>
  <path class="edge" d="M370 828 V856"/>

  <rect class="box" x="150" y="856" width="440" height="48" rx="8"/>
  <text class="label" x="370" y="885">OTW pengambilan <tspan class="fa">&#xf054;</tspan> tiba_pengambilan</text>
  <path class="edge" d="M370 904 V932"/>

  <rect class="box" x="8" y="848" width="132" height="64" rx="8"/>
  <text class="label sub" x="74" y="872">tunda / tolak</text>
  <text class="label sub" x="74" y="890">breakdown + EJO</text>
  <path class="edge" d="M140 880 H150" style="marker-end:none"/>

  <rect class="box" x="130" y="932" width="480" height="56" rx="8"/>
  <text class="label" x="370" y="956">QR muat (Pengawas atau scan gedung)</text>
  <text class="label sub" x="370" y="974">mulai_muat <tspan class="fa">&#xf054;</tspan> selesai_muat + durasi</text>
  <path class="edge" d="M370 988 V1016"/>

  <rect class="box" x="140" y="1016" width="460" height="56" rx="8"/>
  <text class="label" x="370" y="1040">OTW pengiriman <tspan class="fa">&#xf054;</tspan> tiba_pengiriman</text>
  <text class="label sub" x="370" y="1058">multi tujuan: advance current_destination</text>
  <path class="edge" d="M370 1072 V1100"/>

  <rect class="box" x="130" y="1100" width="480" height="56" rx="8"/>
  <text class="label" x="370" y="1124">QR bongkar (Pengawas atau scan gedung)</text>
  <text class="label sub" x="370" y="1142">mulai_bongkar <tspan class="fa">&#xf054;</tspan> selesai_bongkar</text>
  <path class="edge" d="M370 1156 V1184"/>

  <polygon class="decision" points="370,1184 480,1250 370,1316 260,1250"/>
  <text class="label" x="370" y="1242">Masih ada</text>
  <text class="label sub" x="370" y="1262">tujuan?</text>
  <text class="edge-label" x="198" y="1250">Ya</text>
  <text class="edge-label" x="542" y="1250">Tidak</text>

  <path class="edge" d="M260 1250 H80 V1044 H140"/>

  <path class="edge" d="M480 1250 H610 V1368 H370 V1388"/>

  <rect class="box" x="150" y="1388" width="440" height="52" rx="8"/>
  <text class="label" x="370" y="1410">Pulang kosongan / pergi (opsional)</text>
  <text class="label sub" x="370" y="1428">otw_pulang <tspan class="fa">&#xf054;</tspan> sudah_pulang <tspan class="fa">&#xf054;</tspan> selesai</text>
  <path class="edge" d="M370 1440 V1488"/>

  <rect class="box" x="170" y="1488" width="400" height="48" rx="8"/>
  <text class="label" x="370" y="1517">Produksi: confirm kedatangan?</text>
  <path class="edge" d="M370 1536 V1564"/>

  <polygon class="decision" points="370,1564 480,1630 370,1696 260,1630"/>
  <text class="label" x="370" y="1634">Komplain?</text>
  <text class="edge-label" x="198" y="1630">Ya</text>
  <text class="edge-label" x="542" y="1630">Tidak</text>

  <path class="edge" d="M260 1630 H110 V1728"/>
  <rect class="box" x="10" y="1728" width="220" height="56" rx="8"/>
  <text class="label sub" x="120" y="1752">WSM approve / reject</text>
  <text class="label sub" x="120" y="1770">material balik staging</text>

  <path class="edge" d="M480 1630 H610 V1728 H370 V1748"/>

  <rect class="box" x="170" y="1748" width="400" height="52" rx="8"/>
  <text class="label" x="370" y="1770">Confirm + foto (max 2)</text>
  <text class="label sub" x="370" y="1788">NTI opsional di Admin WSM</text>
  <path class="edge" d="M370 1800 V1828"/>

  <rect class="box" x="130" y="1828" width="480" height="56" rx="8"/>
  <text class="label" x="370" y="1852">Leaflet maps: TrackTruck / TrackTruckProses</text>
  <text class="label sub" x="370" y="1870">WebSocket + Telegram sepanjang trip</text>
  <path class="edge" d="M370 1884 V1912"/>

  <rect class="box" x="150" y="1912" width="440" height="52" rx="8"/>
  <text class="label" x="370" y="1934">Samping: Request BAK Produksi</text>
  <text class="label sub" x="370" y="1952">WSM approve <tspan class="fa">&#xf054;</tspan> pengawas / driver flow</text>
</svg>
