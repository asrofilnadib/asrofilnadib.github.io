<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1680" width="100%" role="img" aria-label="Logbook Magang activity diagram swimlanes">
  <defs>
    <marker id="a-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
  </defs>
  <style>
    .lane { fill: #16161a; stroke: #555; stroke-width: 1; }
    .head { fill: #1f2020; stroke: #8750f7; stroke-width: 1.5; }
    .box { fill: #1f2020; stroke: #ccc; stroke-width: 1.2; }
    .dec { fill: #1f2020; stroke: #ccc; stroke-width: 1.2; }
    .label { fill: #e8e8e8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 13px; text-anchor: middle; }
    .headt { fill: #f0e6ff; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .sub { font-size: 11px; fill: #c9c9c9; }
    .edge { stroke: #c9c9c9; stroke-width: 1.4; fill: none; marker-end: url(#a-arrow); }
    .note { fill: #b0b0b0; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 11px; text-anchor: middle; }
  </style>

  <!-- swimlane columns -->
  <rect class="lane" x="20" y="70" width="260" height="1580" rx="6"/>
  <rect class="lane" x="290" y="70" width="260" height="1580" rx="6"/>
  <rect class="lane" x="560" y="70" width="260" height="1580" rx="6"/>
  <rect class="lane" x="830" y="70" width="270" height="1580" rx="6"/>

  <rect class="head" x="20" y="16" width="260" height="44" rx="6"/>
  <text class="headt" x="150" y="43">Intern Magang / PKL</text>
  <rect class="head" x="290" y="16" width="260" height="44" rx="6"/>
  <text class="headt" x="420" y="43">SPV</text>
  <rect class="head" x="560" y="16" width="260" height="44" rx="6"/>
  <text class="headt" x="690" y="43">Manager</text>
  <rect class="head" x="830" y="16" width="270" height="44" rx="6"/>
  <text class="headt" x="965" y="43">System</text>

  <!-- intern login -->
  <rect class="box" x="50" y="90" width="200" height="40" rx="6"/>
  <text class="label" x="150" y="114">Login QR / manual</text>
  <path class="edge" d="M250 110 H965 V140"/>

  <rect class="box" x="850" y="150" width="230" height="48" rx="6"/>
  <text class="label" x="965" y="170">Auth + periode 21-20</text>
  <text class="label sub" x="965" y="188">generate hari + merge absensi</text>
  <path class="edge" d="M850 174 H150 V210"/>

  <rect class="box" x="40" y="220" width="220" height="52" rx="6"/>
  <text class="label" x="150" y="242">Isi kegiatan / leave</text>
  <text class="label sub" x="150" y="260">ganti hari, pulsa, shift</text>
  <path class="edge" d="M260 246 H420 V280"/>

  <rect class="box" x="310" y="290" width="220" height="48" rx="6"/>
  <text class="label" x="420" y="310">Approve izin / sakit</text>
  <text class="label sub" x="420" y="328">approve ganti hari</text>
  <path class="edge" d="M420 338 V370"/>

  <rect class="box" x="310" y="380" width="220" height="48" rx="6"/>
  <text class="label" x="420" y="400">Paraf hari / paraf-all</text>
  <text class="label sub" x="420" y="418">hari kerja elapsed</text>
  <path class="edge" d="M530 404 H965 V450"/>

  <rect class="box" x="850" y="460" width="230" height="44" rx="6"/>
  <text class="label" x="965" y="486">Cek allElapsedWorkingDays</text>
  <path class="edge" d="M850 482 H420 V520"/>

  <rect class="box" x="310" y="530" width="220" height="44" rx="6"/>
  <text class="label" x="420" y="556">Sign periode (TTD SPV)</text>
  <path class="edge" d="M530 552 H690 V600"/>

  <rect class="box" x="580" y="610" width="220" height="52" rx="6"/>
  <text class="label" x="690" y="632">Sign periode (TTD Mgr)</text>
  <text class="label sub" x="690" y="650">hanya jika SPV sudah sign</text>
  <path class="edge" d="M800 636 H965 V690"/>

  <rect class="box" x="850" y="700" width="230" height="56" rx="6"/>
  <text class="label" x="965" y="722">Clip join / end overlap</text>
  <text class="label sub" x="965" y="740">5 Jul start / 16 Agu finish</text>
  <path class="edge" d="M850 728 H150 V780"/>
  <path class="edge" d="M850 728 H420 V780"/>
  <path class="edge" d="M850 728 H690 V780"/>

  <rect class="box" x="40" y="790" width="220" height="40" rx="6"/>
  <text class="label" x="150" y="814">Print PDF (opsional)</text>
  <rect class="box" x="310" y="790" width="220" height="40" rx="6"/>
  <text class="label" x="420" y="814">Preview / print</text>
  <rect class="box" x="580" y="790" width="220" height="40" rx="6"/>
  <text class="label" x="690" y="814">Preview / print</text>
  <path class="edge" d="M150 830 V870 H965"/>

  <rect class="box" x="850" y="880" width="230" height="40" rx="6"/>
  <text class="label" x="965" y="904">PDF baris ter-clip saja</text>
  <path class="edge" d="M965 920 V960"/>

  <rect class="box" x="310" y="970" width="220" height="44" rx="6"/>
  <text class="label" x="420" y="996">Generate Claim Uang Saku</text>
  <path class="edge" d="M530 992 H965 V1040"/>

  <polygon class="dec" points="965,1048 1045,1090 965,1132 885,1090"/>
  <text class="label" x="965" y="1086">Magang</text>
  <text class="label" x="965" y="1102" style="font-size:11px">atau PKL?</text>
  <text class="note" x="820" y="1090">Magang</text>
  <text class="note" x="1110" y="1090">PKL</text>

  <path class="edge" d="M885 1090 H760 V1160"/>
  <rect class="box" x="640" y="1168" width="200" height="52" rx="6"/>
  <text class="label" x="740" y="1190">3.6jt proporsional</text>
  <text class="label sub" x="740" y="1208">jumlah hari overlap</text>

  <path class="edge" d="M1045 1090 H1088 V1160"/>
  <rect class="box" x="980" y="1168" width="120" height="52" rx="6"/>
  <text class="label" x="1040" y="1190">hari hadir</text>
  <text class="label sub" x="1040" y="1208">x tarif</text>

  <path class="edge" d="M740 1220 V1280 H965"/>
  <path class="edge" d="M1040 1220 V1280 H965"/>
  <path class="edge" d="M965 1280 V1310"/>

  <rect class="box" x="840" y="1320" width="250" height="48" rx="6"/>
  <text class="label" x="965" y="1340">Simpan claim + TTD</text>
  <text class="label sub" x="965" y="1356">Dibuat / Diperiksa / Diketahui</text>
  <path class="edge" d="M840 1344 H420 V1400"/>

  <rect class="box" x="310" y="1410" width="220" height="48" rx="6"/>
  <text class="label" x="420" y="1430">Export Excel / PDF</text>
  <text class="label sub" x="420" y="1448">periode + jumlah hari</text>
  <path class="edge" d="M420 1458 V1500 H965"/>

  <rect class="box" x="850" y="1510" width="230" height="48" rx="6"/>
  <text class="label" x="965" y="1530">Dashboard heatmap</text>
  <text class="label sub" x="965" y="1548">FullCalendar kehadiran</text>
</svg>
