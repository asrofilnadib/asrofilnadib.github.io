<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="100%" role="img" aria-label="Logbook Magang data flow diagram">
  <defs>
    <marker id="d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
  </defs>
  <style>
    .ent { fill: #1f2020; stroke: #8750f7; stroke-width: 1.6; }
    .proc { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .store { fill: #16161a; stroke: #aaa; stroke-width: 1.5; }
    .label { fill: #e8e8e8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 13px; text-anchor: middle; }
    .sub { font-size: 11px; fill: #c9c9c9; }
    .flow { stroke: #c9c9c9; stroke-width: 1.3; fill: none; marker-end: url(#d-arrow); }
    .flab { fill: #b0b0b0; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 10px; }
    .title { fill: #f0e6ff; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
  </style>

  <text class="title" x="550" y="28">DFD Magang / PKL - actors, proses, data store</text>

  <!-- external entities -->
  <rect class="ent" x="20" y="70" width="150" height="50" rx="4"/>
  <text class="label" x="95" y="100">Intern</text>
  <rect class="ent" x="20" y="160" width="150" height="50" rx="4"/>
  <text class="label" x="95" y="190">SPV</text>
  <rect class="ent" x="20" y="250" width="150" height="50" rx="4"/>
  <text class="label" x="95" y="280">Manager</text>
  <rect class="ent" x="20" y="340" width="150" height="50" rx="4"/>
  <text class="label" x="95" y="370">Admin PIC</text>
  <rect class="ent" x="20" y="470" width="150" height="56" rx="4"/>
  <text class="label" x="95" y="494">Absensi Server</text>
  <text class="sub" x="95" y="512">device taps</text>

  <!-- processes -->
  <ellipse class="proc" cx="360" cy="95" rx="110" ry="42"/>
  <text class="label" x="360" y="90">1 Isi Logbook</text>
  <text class="sub" x="360" y="108">kegiatan / leave / pulsa</text>

  <ellipse class="proc" cx="360" cy="230" rx="110" ry="42"/>
  <text class="label" x="360" y="225">2 Merge Absensi</text>
  <text class="sub" x="360" y="243">shift + t_absensi</text>

  <ellipse class="proc" cx="360" cy="370" rx="110" ry="42"/>
  <text class="label" x="360" y="365">3 Approval Periode</text>
  <text class="sub" x="360" y="383">paraf SPV - Manager</text>

  <ellipse class="proc" cx="640" cy="160" rx="120" ry="44"/>
  <text class="label" x="640" y="155">4 Clip Join / End</text>
  <text class="sub" x="640" y="173">overlap vs 21-20</text>

  <ellipse class="proc" cx="640" cy="330" rx="120" ry="44"/>
  <text class="label" x="640" y="325">5 Claim Uang Saku</text>
  <text class="sub" x="640" y="343">Magang vs PKL rules</text>

  <ellipse class="proc" cx="640" cy="500" rx="120" ry="42"/>
  <text class="label" x="640" y="495">6 Export</text>
  <text class="sub" x="640" y="513">Excel / PDF / Print</text>

  <!-- data stores (open rectangle look: left bar) -->
  <rect class="store" x="850" y="60" width="230" height="44"/>
  <line x1="862" y1="60" x2="862" y2="104" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="970" y="86">t_magang_master</text>

  <rect class="store" x="850" y="130" width="230" height="44"/>
  <line x1="862" y1="130" x2="862" y2="174" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="970" y="156">t_magang_logbook</text>

  <rect class="store" x="850" y="200" width="230" height="52"/>
  <line x1="862" y1="200" x2="862" y2="252" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="970" y="222">periode_approval</text>
  <text class="sub" x="970" y="238">SPV / Manager TTD</text>

  <rect class="store" x="850" y="280" width="230" height="44"/>
  <line x1="862" y1="280" x2="862" y2="324" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="970" y="306">t_magang_claim</text>

  <rect class="store" x="850" y="350" width="230" height="52"/>
  <line x1="862" y1="350" x2="862" y2="402" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="970" y="372">t_absensi</text>
  <text class="sub" x="970" y="388">absensi_server (juta row)</text>

  <rect class="store" x="850" y="430" width="230" height="44"/>
  <line x1="862" y1="430" x2="862" y2="474" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="970" y="456">hari_libur</text>

  <rect class="store" x="850" y="500" width="230" height="44"/>
  <line x1="862" y1="500" x2="862" y2="544" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="970" y="526">t_magang_claim_pulsa</text>

  <!-- flows intern -->
  <path class="flow" d="M170 95 H250"/>
  <text class="flab" x="185" y="88">kegiatan, leave</text>
  <path class="flow" d="M170 185 H250 V230"/>
  <text class="flab" x="185" y="178">approve leave</text>
  <path class="flow" d="M170 275 H250 V370"/>
  <text class="flab" x="185" y="268">TTD periode</text>
  <path class="flow" d="M170 365 H250"/>
  <text class="flab" x="178" y="358">generate claim</text>
  <path class="flow" d="M170 498 H250 V230"/>
  <text class="flab" x="178" y="530">clock taps</text>

  <!-- process to store -->
  <path class="flow" d="M470 95 H850 V82"/>
  <path class="flow" d="M470 95 H640 V116"/>
  <path class="flow" d="M470 230 H850 V352"/>
  <path class="flow" d="M470 230 H850 V152"/>
  <path class="flow" d="M470 370 H850 V226"/>
  <path class="flow" d="M520 370 H640 V186"/>
  <path class="flow" d="M640 204 H850 V82"/>
  <path class="flow" d="M760 330 H850 V302"/>
  <path class="flow" d="M760 500 H850 V522"/>
  <path class="flow" d="M640 372 V458"/>

  <path class="flow" d="M850 452 H760 V500"/>
  <text class="flab" x="770" y="470">libur / cuti</text>
  <text class="flab" x="500" y="140">clip periode</text>
  <text class="flab" x="500" y="310">jumlah hari</text>
  <text class="flab" x="700" y="560">periode + jumlah hari</text>

  <!-- legend -->
  <rect class="ent" x="20" y="880" width="24" height="18" rx="2"/>
  <text class="sub" x="120" y="894">external entity</text>
  <ellipse class="proc" cx="280" cy="889" rx="18" ry="12"/>
  <text class="sub" x="360" y="894">process</text>
  <rect class="store" x="430" y="880" width="36" height="18"/>
  <line x1="436" y1="880" x2="436" y2="898" stroke="#aaa" stroke-width="2"/>
  <text class="sub" x="530" y="894">data store</text>
  <text class="sub" x="800" y="894">Clip: join 5 Jul / finish 16 Agu memotong label periode export</text>
</svg>
