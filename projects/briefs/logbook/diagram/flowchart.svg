<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2280" width="100%" role="img" aria-label="Logbook Magang PKL process flowchart">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
  </defs>
  <style>
    .box { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .decision { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .label { fill: #e8e8e8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 15px; text-anchor: middle; }
    .sub { font-size: 13px; }
    .fa { font-family: "Font Awesome 6 Pro", "Font Awesome 6 Free", sans-serif; font-weight: 900; font-size: 9px; fill: #8750f7; }
    .edge { stroke: #c9c9c9; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .edge-label { fill: #b0b0b0; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 12px; text-anchor: middle; }
  </style>

  <rect class="box" x="190" y="20" width="340" height="52" rx="8"/>
  <text class="label" x="360" y="42">Admin: Master Magang / PKL</text>
  <text class="label sub" x="360" y="60">NIK, jenis, SPV, Manager, cost center</text>
  <path class="edge" d="M360 72 V100"/>

  <rect class="box" x="190" y="100" width="340" height="52" rx="8"/>
  <text class="label" x="360" y="122">Intern login QR / manual</text>
  <text class="label sub" x="360" y="140">pilih tahun + periode 21 s/d 20</text>
  <path class="edge" d="M360 152 V180"/>

  <rect class="box" x="150" y="180" width="420" height="56" rx="8"/>
  <text class="label" x="360" y="204">Generate hari dalam periode</text>
  <text class="label sub" x="360" y="222">weekend <tspan class="fa">&#xf054;</tspan> HariLibur <tspan class="fa">&#xf054;</tspan> ganti hari</text>
  <path class="edge" d="M360 236 V264"/>

  <rect class="box" x="140" y="264" width="440" height="56" rx="8"/>
  <text class="label" x="360" y="288">Merge t_absensi + MagangShiftRules</text>
  <text class="label sub" x="360" y="306">prioritas: isi logbook &gt; tap absensi</text>
  <path class="edge" d="M360 320 V348"/>

  <rect class="box" x="150" y="348" width="420" height="56" rx="8"/>
  <text class="label" x="360" y="372">Isi kegiatan harian</text>
  <text class="label sub" x="360" y="390">izin / sakit / NPL <tspan class="fa">&#xf054;</tspan> pulsa <tspan class="fa">&#xf054;</tspan> weekly shift</text>
  <path class="edge" d="M360 404 V432"/>

  <rect class="box" x="180" y="432" width="360" height="48" rx="8"/>
  <text class="label" x="360" y="461">SPV approve leave / ganti hari</text>
  <path class="edge" d="M360 480 V508"/>

  <polygon class="decision" points="360,508 456,568 360,628 264,568"/>
  <text class="label" x="360" y="564">Semua hari kerja</text>
  <text class="label" x="360" y="582" style="font-size:13px">sudah diparaf?</text>
  <text class="edge-label" x="200" y="568">Belum</text>
  <text class="edge-label" x="520" y="568">Ya</text>

  <path class="edge" d="M264 568 H150 V500"/>
  <rect class="box" x="20" y="448" width="160" height="56" rx="8"/>
  <text class="label sub" x="100" y="472">SPV paraf hari</text>
  <text class="label sub" x="100" y="490">atau paraf-all</text>
  <path class="edge" d="M100 448 V404 H360"/>

  <path class="edge" d="M456 568 H580 V656 H360 V676"/>

  <rect class="box" x="190" y="676" width="340" height="48" rx="8"/>
  <text class="label" x="360" y="705">ready_spv <tspan class="fa">&#xf054;</tspan> SPV TTD periode</text>
  <path class="edge" d="M360 724 V752"/>

  <polygon class="decision" points="360,752 448,808 360,864 272,808"/>
  <text class="label" x="360" y="812">Manager sign?</text>
  <text class="edge-label" x="200" y="808">SPV belum</text>
  <text class="edge-label" x="530" y="808">OK</text>

  <path class="edge" d="M272 808 H140 V900"/>
  <rect class="box" x="40" y="900" width="180" height="44" rx="8"/>
  <text class="label sub" x="130" y="926">blokir (SPV belum TTD)</text>

  <path class="edge" d="M448 808 H580 V900 H360 V920"/>

  <rect class="box" x="190" y="920" width="340" height="48" rx="8"/>
  <text class="label" x="360" y="949">manager_signed</text>
  <path class="edge" d="M360 968 V996"/>

  <rect class="box" x="120" y="996" width="480" height="72" rx="8"/>
  <text class="label" x="360" y="1020">Clip overlap 2026-09-02</text>
  <text class="label sub" x="360" y="1038">internStart = min(created_at, MIN tanggal)</text>
  <text class="label sub" x="360" y="1056">clip vs 21-20 (join 5 Jul / finish 16 Agu)</text>
  <path class="edge" d="M360 1068 V1096"/>

  <rect class="box" x="180" y="1096" width="360" height="48" rx="8"/>
  <text class="label" x="360" y="1125">Print PDF logbook (baris ter-clip)</text>
  <path class="edge" d="M360 1144 V1172"/>

  <rect class="box" x="160" y="1172" width="400" height="52" rx="8"/>
  <text class="label" x="360" y="1194">PIC: Generate Claim Uang Saku</text>
  <text class="label sub" x="360" y="1212">activeOverlap() per intern</text>
  <path class="edge" d="M360 1224 V1252"/>

  <polygon class="decision" points="360,1252 456,1316 360,1380 264,1316"/>
  <text class="label" x="360" y="1320">Jenis intern?</text>
  <text class="edge-label" x="200" y="1316">Magang</text>
  <text class="edge-label" x="530" y="1316">PKL</text>

  <path class="edge" d="M264 1316 H120 V1416"/>
  <rect class="box" x="10" y="1416" width="230" height="72" rx="8"/>
  <text class="label sub" x="125" y="1440">Magang: 3.6jt / periode</text>
  <text class="label sub" x="125" y="1458">proporsional x jumlah hari</text>
  <text class="label sub" x="125" y="1476">izin + NPL tidak dihitung</text>

  <path class="edge" d="M456 1316 H600 V1416"/>
  <rect class="box" x="480" y="1416" width="230" height="72" rx="8"/>
  <text class="label sub" x="595" y="1440">PKL: hari hadir x tarif</text>
  <text class="label sub" x="595" y="1458">ENG 100rb / Non-ENG 50rb</text>
  <text class="label sub" x="595" y="1476">skip libur / izin / sakit / NPL</text>

  <path class="edge" d="M125 1488 V1560 H360"/>
  <path class="edge" d="M595 1488 V1560 H360"/>
  <path class="edge" d="M360 1560 V1580"/>

  <rect class="box" x="140" y="1580" width="440" height="56" rx="8"/>
  <text class="label" x="360" y="1604">+ pulsa, group PAS / BAS</text>
  <text class="label sub" x="360" y="1622">TTD: Dibuat <tspan class="fa">&#xf054;</tspan> Diperiksa <tspan class="fa">&#xf054;</tspan> Diketahui</text>
  <path class="edge" d="M360 1636 V1664"/>

  <rect class="box" x="120" y="1664" width="480" height="64" rx="8"/>
  <text class="label" x="360" y="1688">Export Excel / PDF</text>
  <text class="label sub" x="360" y="1708">Periode clipped + Jumlah Hari (Magang &amp; PKL)</text>
  <path class="edge" d="M360 1728 V1756"/>

  <rect class="box" x="160" y="1756" width="400" height="56" rx="8"/>
  <text class="label" x="360" y="1780">Dashboard heatmap + FullCalendar</text>
  <text class="label sub" x="360" y="1798">kehadiran dari t_absensi per periode</text>
</svg>
